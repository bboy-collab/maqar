<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>maqar</title>
    <link rel="stylesheet" href="todo-list.css">
     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
</head>
<body>
    <main>
        <header>
            <h1>MAQAR</h1>
            <NAv>
                <ul>
                    <LI><a href="dashboard.html">MAIN</a></LI>
                    <LI><a href="notes.html">NOTES</a></LI>
                    <LI><a href="todo-list.html">TODO-LIST</a></LI>
                    <LI><a href="links.html">LINKS</a></LI>
                </ul>
            </NAv>
            <!-- time goes here -->
        </header><br>
        <button id="addListButton">Add list</button><br><br>
        <section id="listSection">
            <div id="listContainer">
                <input type="text" id="listname" placeholder="Project Name"><br>
                <div class="stat-container">
                    <div class="details">
                        <h3>Progress</h3>
                        <div id="progressBar">
                            <div id="progress"></div>
                        </div>
                    </div>

                    <div class="stat-number">
                        <p id="numbers">0 / 0</p>
                    </div>
                </div>
                <form id="taskForm">
                    <input type="text" id="taskInput" placeholder="Enter a task">
                    <button id="addTaskButton"><i class="fa-solid fa-plus"></i></button>
                </form>
                <div id="taskContainer">
                    <ul id="taskList"></ul>
                </div>
            </div>
        </section>
        <br><br><br><br><br><br><br>
    </main>
     <script src="todo-list.js"></script>
</body> 
</html>
