<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAQAR - Notes</title>
    <link rel="stylesheet" href="notes.css">
     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
</head>
<body>
  <header>
        <h1>MAQAR</h1>
        <NAv>
            <ul>
                <LI><a href="dashboard.html">MAIN</a></LI>
                <LI><a href="notes.html">NOTES</a></LI>
                <LI><a href="todo-list.html">TODO-LIST</a></LI>
                <LI><a href="links.html">LINKS</a></LI>
            </ul>
        </NAv>
        <!-- time goes here -->
  </header>

  <div class="headOfNotes">
    <h1>Notes</h1>
    <div>
      <button class="add-note-btn" onclick="openNoteDialog()">+ Add Note</button>
    </div>
  </div>

  <main id="notesContainer" class="notes-grid">
    
  </main>

  <dialog id="noteDialog">
    <div class="dialog-content">
      <div class="dialog-header">
        <h2 class="dialog-title" id="dialogTitle">Add New Note</h2>
        <button class="close-btn" onclick="closeNoteDialog()">x</button>
      </div>
    </div>

    <form id="noteForm">
      <div class="form-group">
        <label for="noteTitle" class="form-label">Title</label>
        <input type="text" id="noteTitle" class="form-input" placeholder="Enter note title...">
      </div>

      <div class="form-group">
        <label for="noteContent" class="form-label">Content</label>
        <textarea id="noteContent" class="form-textarea" placeholder="Write your note here..."required></textarea>
      </div>

      <div class="dialog-actions">
        <button type="button" class="cancle-btn" onclick="closeNoteDialog()">Cancle</button>
        <button type="submit" class="save-btn">Save Note</button>
      </div>
    </form>
  </dialog>
  <script src="notes.js"></script>
</body>
</html>
