<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAQAR-Links</title>
    <link rel="stylesheet" href="links.css">
</head>
<body>
    <header>
        <h1>MAQAR</h1>
        <NAv>
            <ul>
                <LI><a href="index.html">MAIN</a></LI>
                <LI><a href="notes.html">NOTES</a></LI>
                <LI><a href="todo-list.html">TODO-LIST</a></LI>
                <LI><a href="links.html">LINKS</a></LI>
            </ul>
        </NAv>
        
    </header><br><br><br><br><br><br>
    <h2>Lists</h2>
    <button id="addListButton">Add List</button>
    <div class="listsContainer">
        
        
        <div class="linksCard">
            <div class="listHeader">
                <h3>title</h3>
            
                <div class="listButtons">
                    <button class="deleteListButton">X</button>
                    <button class="editListButton">Edit</button>
                </div>
            </div>
            <button class="addLinkButton">Add Link</button>
            <ul class="linksContainer">
                
            </ul>

        </div>

    </div>

    <dialog id="addLinkDialog">
        <form method="dialog">
            <label for="linkTitle">Link Title:</label>
            <input type="text" id="linkTitle" name="linkTitle" required>
            <label for="linkURL">Link URL:</label>
            <input type="url" id="linkURL" name="linkURL" required>
            <menu>
                <button value="cancel" onclick="closeAddLinkDialog()">Cancel</button>
                <button value="default">Add Link</button>
            </menu>
        </form>
    </dialog>

    <dialog id="addGroupDialog">
        <form method="dialog">
            <label for="groupTitle">Group Title:</label>
            <input type="text" id="groupTitle" name="groupTitle" required>
            <menu>
                <button value="cancel" onclick="closeAddGroupDialog()">Cancel</button>
                <button value="default">Add Group</button>
            </menu>
        </form>
    </dialog>
   <script src="links.js"></script>
</body>
</html>
